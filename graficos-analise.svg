<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">Histograma, ECDF, boxplot e scatterplot</title><desc id="desc">Quatro gráficos resumem as visualizações da seção de estatística descritiva.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#19384a}.t{font-size:16px;font-weight:700}.s{font-size:12px;fill:#5c6b78}.a{stroke:#8da2ad;stroke-width:1.5}.g{stroke:#dce7eb}.b{fill:#56a9be}.l{fill:none;stroke:#176b87;stroke-width:3}.p{fill:#176b87}</style>
  <rect width="920" height="260" rx="9" fill="#fff"/>
  <g transform="translate(25 28)"><text class="t">Histograma</text><path class="g" d="M0 65H185M0 110H185M0 155H185"/><path class="a" d="M0 160H195M0 160V42"/><rect class="b" x="18" y="116" width="24" height="44"/><rect class="b" x="47" y="72" width="24" height="88"/><rect class="b" x="76" y="50" width="24" height="110"/><rect class="b" x="105" y="83" width="24" height="77"/><rect class="b" x="134" y="122" width="24" height="38"/><text class="s" x="0" y="190">barras: frequência por classe</text></g>
  <g transform="translate(250 28)"><text class="t">ECDF</text><path class="g" d="M0 65H185M0 110H185M0 155H185"/><path class="a" d="M0 160H195M0 160V42"/><path class="l" d="M3 160H35V138H75V105H116V72H157V48H190"/><text class="s" x="0" y="190">degraus: frequência acumulada</text></g>
  <g transform="translate(475 28)"><text class="t">Boxplot</text><path class="a" d="M0 112H192"/><path class="l" d="M18 112H50M50 88V136M50 98H145V126H50M98 98V126M145 88V136M145 112H178"/><circle class="p" cx="187" cy="112" r="4"/><text class="s" x="0" y="190">mediana, IQR e possível outlier</text></g>
  <g transform="translate(700 28)"><text class="t">Scatterplot</text><path class="g" d="M0 65H185M0 110H185M0 155H185"/><path class="a" d="M0 160H195M0 160V42"/><path class="l" d="M12 145L176 53" opacity=".45"/><g class="p"><circle cx="22" cy="139" r="4"/><circle cx="49" cy="128" r="4"/><circle cx="69" cy="113" r="4"/><circle cx="96" cy="101" r="4"/><circle cx="121" cy="88" r="4"/><circle cx="151" cy="68" r="4"/><circle cx="173" cy="57" r="4"/></g><text class="s" x="0" y="190">pontos: associação entre pares</text></g>
</svg>
