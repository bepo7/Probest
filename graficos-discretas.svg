<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">Distribuições discretas</title><desc id="desc">PMF Bernoulli e distribuição binomial.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#4b2630}.t{font-size:17px;font-weight:700}.s{font-size:12px;fill:#6f5a60}.a{stroke:#ac9aa0;stroke-width:1.5}.g{stroke:#f0e0e4}.b{fill:#bf6174}.l{fill:none;stroke:#a34b5f;stroke-width:3}</style>
  <rect width="920" height="260" rx="9" fill="#fff"/>
  <g transform="translate(45 30)"><text class="t">PMF de Bernoulli</text><text class="s" x="0" y="20">P(X = 1) = p</text><path class="g" d="M0 70H320M0 120H320M0 170H320"/><path class="a" d="M0 175H330M0 175V48"/><rect class="b" x="72" y="115" width="60" height="60"/><rect class="b" x="200" y="70" width="60" height="105"/><text class="s" x="92" y="198">0</text><text class="s" x="220" y="198">1</text><text class="s" x="60" y="107">1 − p</text><text class="s" x="220" y="62">p</text></g>
  <g transform="translate(505 30)"><text class="t">PMF binomial</text><text class="s" x="0" y="20">n tentativas independentes</text><path class="g" d="M0 70H320M0 120H320M0 170H320"/><path class="a" d="M0 175H330M0 175V48"/><path class="l" d="M18 164L65 143L112 104L159 63L206 104L253 143L300 164"/><g fill="#bf6174"><circle cx="18" cy="164" r="5"/><circle cx="65" cy="143" r="5"/><circle cx="112" cy="104" r="5"/><circle cx="159" cy="63" r="5"/><circle cx="206" cy="104" r="5"/><circle cx="253" cy="143" r="5"/><circle cx="300" cy="164" r="5"/></g><text class="s" x="13" y="198">0</text><text class="s" x="154" y="198">k</text><text class="s" x="296" y="198">n</text></g>
</svg>
